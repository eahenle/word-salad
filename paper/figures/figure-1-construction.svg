<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#1f2937}.title{font-size:24px;font-weight:700}.axis{font-size:12px;fill:#4b5563}.label{font-size:14px}.value{font-size:13px;font-weight:700}</style>
<text class="title" x="540.0" y="34" text-anchor="middle">Equal-bag ordered-channel construction</text>
<rect x="50" y="80" width="270" height="82" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="185" y="110" text-anchor="middle" font-size="17" font-weight="700">Payload A</text>
<text x="185" y="136" text-anchor="middle" font-size="13">same words; operation order A</text>
<rect x="50" y="200" width="270" height="82" rx="10" fill="#ede9fe" stroke="#64748b"/>
<text x="185" y="230" text-anchor="middle" font-size="17" font-weight="700">Payload B</text>
<text x="185" y="256" text-anchor="middle" font-size="13">same words; operation order B</text>
<rect x="400" y="80" width="270" height="82" rx="10" fill="#ecfccb" stroke="#64748b"/>
<text x="535" y="110" text-anchor="middle" font-size="17" font-weight="700">Carrier mask</text>
<text x="535" y="136" text-anchor="middle" font-size="13">fixed, jitter, or uniformly random</text>
<rect x="400" y="200" width="270" height="82" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="535" y="230" text-anchor="middle" font-size="17" font-weight="700">Matched interference</text>
<text x="535" y="256" text-anchor="middle" font-size="13">same distractor words and positions</text>
<rect x="760" y="140" width="270" height="82" rx="10" fill="#f3f4f6" stroke="#64748b"/>
<text x="895" y="170" text-anchor="middle" font-size="17" font-weight="700">Stimulus</text>
<text x="895" y="196" text-anchor="middle" font-size="13">identical aggregate word bag</text>
<path d="M 320 121 C 350 121, 360 140, 400 140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 320 241 C 350 241, 360 140, 400 140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 670 121 C 710 121, 710 181, 760 181" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 670 241 C 710 241, 710 181, 760 181" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<text x="540" y="345" text-anchor="middle" font-size="18" font-weight="700">Primary paired endpoint</text>
<text x="540" y="382" text-anchor="middle" font-size="16">A stimulus → answer A  AND  B stimulus → answer B</text>
<text x="540" y="425" text-anchor="middle" font-size="14">Shuffled controls preserve lexical content but contain no intact ordered task.</text>
</svg>
